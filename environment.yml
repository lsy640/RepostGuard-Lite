name: repostguard
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pytorch=2.5.1
  - torchvision=0.20.1
  - pytorch-cuda=12.1
  - numpy=1.26
  - pillow>=10
  - pyyaml>=6
  - scipy>=1.12
  - scikit-learn>=1.5
  - pandas>=2.2
  - matplotlib-base>=3.8
  - tqdm>=4.66
  - pip
  - pip:
      - datasets==5.0.1
      - kagglehub==1.0.2
      - open-clip-torch==3.3.0
      - pytest>=8,<9
      - -e .
