base: student_v31_base.yaml

# V3.2 is intentionally separate from the v3.1 ablations.  It fixes two
# implementation-level biases before adding richer representation transfer.
data:
  # Respect the four-CPU allocation left while the teammate's CPU-only job runs.
  num_workers: 4

model:
  student_forensic:
    enabled: true
    pretrained: true
    distill_dim: 256
    fusion_dim: 512
    use_npr: true
    quality_gate_enabled: true
    quality_gate_hidden_dim: 32
    fusion_uses_projected_semantic: true

distillation:
  cache_directory: data/cache/teacher_logits/community_forensics_m3_v32_features_gate
  temperature: 1.0
  sampling:
    strategy: class_arch_generator_hierarchical
    generator_alpha: 0.5
    real_source_alpha: 0.5
  teacher_calibration:
    method: per_view_affine_platt
    path: outputs/community_forensics_v32/teacher_affine_calibration.json
  teacher_reliability:
    enabled: true
    confidence_power: 1.0
    wrong_teacher_scale: 0.10
    minimum_weight: 0.0
  distillation_warmup_epochs: 3

  # Preserve GT supervision as the anchor.  Binary logits carry little dark
  # knowledge, so feature geometry gets more weight than soft BCE.
  hard_label_weight: 0.50
  soft_teacher_weight: 0.15
  consistency_weight: 0.05
  feature_weight: 0.30
  feature_distillation:
    enabled: true
    teacher_dim: 256
    branch_weights:
      semantic: 0.15
      forensic: 0.35
      fused: 0.50
    component_weights:
      pointwise: 0.65
      relational: 0.25
      quality_gate: 0.10
    relational:
      enabled: true
      branch_weights:
        forensic: 0.40
        fused: 0.60
      cross_view_delta_weight: 0.25
    quality_gate_distillation:
      enabled: true

output:
  directory: outputs/community_forensics_v32/student_corrected
