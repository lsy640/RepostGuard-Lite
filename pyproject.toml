[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repostguard-lite"
version = "0.1.0"
description = "Robust AI-generated image detection baselines and paired-consistency prototype"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "datasets==5.0.1",
  "kagglehub==1.0.2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<2",
  "open-clip-torch==3.3.0",
  "pandas>=2.2,<3",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.12,<2",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
repostguard-train = "repostguard.train:main"
repostguard-evaluate = "repostguard.evaluate:main"
repostguard-infer = "repostguard.infer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
